<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Lee Hayward PT</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #161213; color: #EDE0E1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #1E1B1C; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; border: 1px solid rgba(154,143,144,0.12); }
    .logo { font-family: 'Lexend', sans-serif; font-size: 1rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
    .logo span { color: #FD772A; }
    .subtitle { font-size: 0.75rem; color: #9A8F90; margin-bottom: 32px; }
    h1 { font-family: 'Lexend', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 24px; }
    label { display: block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9A8F90; margin-bottom: 6px; }
    input { width: 100%; background: #252122; border: 1px solid rgba(154,143,144,0.2); border-radius: 8px; padding: 12px 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.9rem; color: #EDE0E1; outline: none; transition: border-color 0.15s; margin-bottom: 16px; }
    input:focus { border-color: #FD772A; }
    .btn { width: 100%; padding: 13px; background: linear-gradient(45deg, #FD772A, #C04E00); color: #fff; border: none; border-radius: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { border-radius: 8px; padding: 12px 14px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
    .msg.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #f87171; }
    .msg.success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: #4ade80; }
    .invalid { text-align: center; padding: 20px 0; }
    .invalid svg { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Lee Hayward <span>PT</span></div>
    <div class="subtitle">Client Portal</div>
    <div id="invalidMsg" class="invalid" style="display:none">
      <svg viewBox="0 0 24 24" stroke="#f87171" fill="none" stroke-width="2" width="40" height="40"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <h1 style="color:#f87171;font-size:1.2rem">Link Expired</h1>
      <p style="font-size:0.85rem;color:#9A8F90;margin-top:8px">This reset link has expired or already been used.</p>
      <a href="/client-forgot-password.html" style="display:inline-block;margin-top:16px;color:#FD772A;font-size:0.85rem;text-decoration:none">Request a new link →</a>
    </div>
    <div id="resetForm">
      <h1>Set New Password</h1>
      <div class="msg error" id="errorMsg"></div>
      <div class="msg success" id="successMsg"></div>
      <label>New Password</label>
      <input type="password" id="password" placeholder="Minimum 8 characters"/>
      <label>Confirm Password</label>
      <input type="password" id="passwordConfirm" placeholder="Repeat password"/>
      <button class="btn" id="resetBtn">Set New Password</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('invalidMsg').style.display = 'block';
    }
    document.getElementById('resetBtn').addEventListener('click', async () => {
      const pw  = document.getElementById('password').value;
      const pw2 = document.getElementById('passwordConfirm').value;
      const err = document.getElementById('errorMsg');
      const suc = document.getElementById('successMsg');
      err.style.display = 'none'; suc.style.display = 'none';
      if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; return; }
      if (pw !== pw2) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }
      const btn = document.getElementById('resetBtn');
      btn.textContent = 'Saving…'; btn.disabled = true;
      try {
        const res = await fetch('/api/client/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pw })
        });
        const data = await res.json();
        if (!res.ok) {
          if (res.status === 400 && data.error.includes('invalid')) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('invalidMsg').style.display = 'block';
            return;
          }
          throw new Error(data.error);
        }
        suc.textContent = 'Password updated! Redirecting to login…';
        suc.style.display = 'block';
        document.getElementById('password').style.display = 'none';
        document.getElementById('passwordConfirm').style.display = 'none';
        btn.style.display = 'none';
        setTimeout(() => window.location.href = '/client-login.html', 2000);
      } catch (e) {
        err.textContent = e.message || 'Something went wrong.'; err.style.display = 'block';
        btn.textContent = 'Set New Password'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
