<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar — Lee Hayward PT Admin</title>
  <style>
/* =============================================
   LEE HAYWARD PT — ADMIN DASHBOARD STYLES
   ============================================= */

@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');

/* === DESIGN TOKENS (same as main) === */
:root {
  --surface:                  #161213;
  --surface-container-lowest: #110d0e;
  --surface-container-low:    #1E1B1C;
  --surface-container:        #252122;
  --surface-container-high:   #2E2A2B;
  --surface-container-highest:#383435;
  --primary:                  #FF6B6B;
  --primary-container:        #C02425;
  --secondary:                #FFB787;
  --secondary-container:      #A55100;
  --on-primary:               #FFFFFF;
  --on-surface:               #EDE0E1;
  --on-surface-variant:       #9A8F90;
  --outline-variant:          rgba(154, 143, 144, 0.15);
  --gradient-cta:             linear-gradient(45deg, #C02425, #A55100);
  --font-display:             'Lexend', sans-serif;
  --font-body:                'Plus Jakarta Sans', sans-serif;
  --space-xs:   0.5rem;
  --space-sm:   1rem;
  --space-md:   1.5rem;
  --space-lg:   2rem;
  --space-xl:   3rem;
  --roundness-xs: 2px;
  --roundness-sm: 4px;
  --roundness-md: 8px;
  --roundness-lg: 12px;
  --transition-kinetic: 300ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --shadow-float: 0 20px 40px rgba(17, 13, 14, 0.4);
  --sidebar-width: 220px;
}

/* === RESET === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  height: 100%;
  -webkit-font-smoothing: antialiased;
  display: flex;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { cursor: pointer; font-family: var(--font-body); }

/* === LAYOUT === */
.admin-layout {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

/* === SIDEBAR === */
.sidebar {
  width: var(--sidebar-width);
  background: var(--surface-container-lowest);
  display: flex;
  flex-direction: column;
  padding: var(--space-lg) 0;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  border-right: 1px solid var(--outline-variant);
}
.sidebar-brand {
  padding: 0 var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--outline-variant);
  margin-bottom: var(--space-md);
}
.sidebar-logo {
  font-family: var(--font-display);
  font-size: 0.9375rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--on-surface);
  line-height: 1.2;
}
.sidebar-logo span { color: var(--primary-container); }
.sidebar-sub {
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--on-surface-variant);
  margin-top: 4px;
}
.sidebar-nav {
  flex: 1;
  padding: 0 var(--space-sm);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sidebar-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px var(--space-sm);
  border-radius: var(--roundness-md);
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--on-surface-variant);
  transition: var(--transition-kinetic);
  position: relative;
}
.sidebar-link svg { width: 18px; height: 18px; stroke: currentColor; fill: none; flex-shrink: 0; }
.sidebar-link:hover { background: var(--surface-container); color: var(--on-surface); }
.sidebar-link.active {
  background: var(--surface-container-high);
  color: var(--on-surface);
}
.sidebar-link.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 20px;
  background: var(--gradient-cta);
  border-radius: 0 2px 2px 0;
}
.sidebar-footer {
  padding: var(--space-md) var(--space-sm) 0;
  border-top: 1px solid var(--outline-variant);
  margin-top: var(--space-md);
}
.sidebar-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: var(--space-sm);
  border-radius: var(--roundness-md);
}
.sidebar-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--gradient-cta);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 0.75rem;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
  overflow: hidden;
}
.sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
.sidebar-user-info h4 { font-size: 0.8125rem; font-weight: 600; color: var(--on-surface); }
.sidebar-user-info p  { font-size: 0.7rem; color: var(--on-surface-variant); margin-top: 1px; }
.sidebar-logout {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px var(--space-sm);
  border-radius: var(--roundness-md);
  font-size: 0.8rem;
  color: var(--on-surface-variant);
  background: none;
  border: none;
  width: 100%;
  margin-top: 4px;
  transition: var(--transition-kinetic);
}
.sidebar-logout svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }
.sidebar-logout:hover { color: var(--primary-container); background: rgba(192,36,37,0.08); }

/* === MAIN CONTENT === */
.admin-main {
  margin-left: var(--sidebar-width);
  flex: 1;
  min-height: 100vh;
  background: var(--surface-container-lowest);
  display: flex;
  flex-direction: column;
}

/* === TOP BAR === */
.admin-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-md) var(--space-lg);
  background: rgba(17, 13, 14, 0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--outline-variant);
  position: sticky;
  top: 0;
  z-index: 50;
}
.admin-topbar-left h1 {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--on-surface);
  line-height: 1;
}
.admin-topbar-left p {
  font-size: 0.75rem;
  color: var(--on-surface-variant);
  margin-top: 3px;
}
.admin-topbar-right {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}
.topbar-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--roundness-sm);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: none;
  transition: var(--transition-kinetic);
}
.topbar-btn-primary {
  background: var(--gradient-cta);
  color: #fff;
}
.topbar-btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.topbar-btn-secondary {
  background: var(--surface-container);
  color: var(--on-surface);
}
.topbar-btn-secondary:hover { background: var(--surface-container-high); }
.topbar-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

/* === PAGE CONTENT === */
.admin-content {
  flex: 1;
  padding: var(--space-lg);
}

/* === KPI CARDS === */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-md);
  margin-bottom: var(--space-lg);
}
.kpi-card {
  background: var(--surface-container-low);
  border-radius: var(--roundness-lg);
  padding: var(--space-md) var(--space-lg);
}
.kpi-label {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--on-surface-variant);
  margin-bottom: var(--space-sm);
}
.kpi-value {
  font-family: var(--font-display);
  font-size: 2.25rem;
  font-weight: 900;
  color: var(--on-surface);
  line-height: 1;
  margin-bottom: 8px;
}
.kpi-value span { font-size: 1rem; color: var(--on-surface-variant); }
.kpi-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  color: #4ade80;
  background: rgba(74, 222, 128, 0.1);
  padding: 3px 8px;
  border-radius: 3px;
}
.kpi-bar { margin-top: var(--space-sm); }
.kpi-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: var(--on-surface-variant);
  margin-bottom: 6px;
}
.kpi-bar-track {
  height: 4px;
  background: var(--surface-container-highest);
  border-radius: 2px;
  overflow: hidden;
}
.kpi-bar-fill {
  height: 100%;
  background: var(--gradient-cta);
  border-radius: 2px;
  transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
}

/* === CLIENT TABLE === */
.client-table-wrap {
  background: var(--surface-container-low);
  border-radius: var(--roundness-lg);
  overflow: hidden;
}
.client-table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--outline-variant);
  flex-wrap: wrap;
  gap: var(--space-sm);
}
.client-tabs {
  display: flex;
  gap: 4px;
}
.tab-btn {
  padding: 6px 14px;
  border-radius: var(--roundness-sm);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: none;
  border: none;
  color: var(--on-surface-variant);
  transition: var(--transition-kinetic);
}
.tab-btn.active {
  background: var(--surface-container-high);
  color: var(--on-surface);
}
.tab-btn:hover:not(.active) { color: var(--on-surface); }
.search-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-container);
  border-radius: var(--roundness-sm);
  padding: 6px 12px;
}
.search-wrap svg { width: 14px; height: 14px; stroke: var(--on-surface-variant); fill: none; flex-shrink: 0; }
.search-wrap input {
  background: none;
  border: none;
  outline: none;
  font-family: var(--font-body);
  font-size: 0.8125rem;
  color: var(--on-surface);
  width: 180px;
}
.search-wrap input::placeholder { color: var(--on-surface-variant); }
.client-table {
  width: 100%;
  border-collapse: collapse;
}
.client-table thead tr {
  border-bottom: 1px solid var(--outline-variant);
}
.client-table th {
  padding: 10px var(--space-lg);
  text-align: left;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--on-surface-variant);
}
.client-table tbody tr {
  border-bottom: 1px solid var(--outline-variant);
  transition: background var(--transition-fast);
  cursor: pointer;
}
.client-table tbody tr:last-child { border-bottom: none; }
.client-table tbody tr:hover { background: var(--surface-container); }
.client-table td {
  padding: 14px var(--space-lg);
  vertical-align: middle;
}
.client-cell {
  display: flex;
  align-items: center;
  gap: 12px;
}
.client-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--surface-container-high);
  overflow: hidden;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--on-surface-variant);
}
.client-avatar img { width: 100%; height: 100%; object-fit: cover; }
.client-name { font-size: 0.875rem; font-weight: 600; color: var(--on-surface); }
.client-email { font-size: 0.75rem; color: var(--on-surface-variant); margin-top: 2px; }
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 3px;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.status-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-active   { background: rgba(74,222,128,0.1); color: #4ade80; }
.status-active::before  { background: #4ade80; }
.status-onboarding { background: rgba(251,191,36,0.1); color: #fbbf24; }
.status-onboarding::before { background: #fbbf24; }
.status-paused   { background: rgba(154,143,144,0.15); color: var(--on-surface-variant); }
.status-paused::before  { background: var(--on-surface-variant); }
.tier-text { font-size: 0.8125rem; color: var(--on-surface-variant); }
.progress-mini-wrap {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}
.progress-mini-bar {
  flex: 1;
  height: 4px;
  background: var(--surface-container-highest);
  border-radius: 2px;
  overflow: hidden;
  min-width: 80px;
}
.progress-mini-fill { height: 100%; background: var(--gradient-cta); border-radius: 2px; }
.progress-mini-label {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--on-surface-variant);
  white-space: nowrap;
}
.action-btns {
  display: flex;
  gap: 6px;
}
.action-btn {
  width: 30px;
  height: 30px;
  border-radius: var(--roundness-sm);
  background: var(--surface-container-high);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition-kinetic);
}
.action-btn svg { width: 14px; height: 14px; stroke: var(--on-surface-variant); fill: none; }
.action-btn:hover { background: var(--primary-container); }
.action-btn:hover svg { stroke: #fff; }
.table-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-sm) var(--space-lg);
  border-top: 1px solid var(--outline-variant);
}
.table-info { font-size: 0.75rem; color: var(--on-surface-variant); }
.pagination {
  display: flex;
  align-items: center;
  gap: 4px;
}
.page-btn {
  width: 30px;
  height: 30px;
  border-radius: var(--roundness-sm);
  background: var(--surface-container-high);
  border: none;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--on-surface-variant);
  transition: var(--transition-kinetic);
  display: flex;
  align-items: center;
  justify-content: center;
}
.page-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; }
.page-btn.active { background: var(--primary-container); color: #fff; }
.page-btn:hover:not(.active) { background: var(--surface-container-highest); color: var(--on-surface); }

/* === PROFILE PAGE === */
.profile-header {
  background: var(--surface-container-low);
  border-radius: var(--roundness-lg);
  padding: var(--space-lg);
  margin-bottom: var(--space-md);
}
.profile-header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-md);
  flex-wrap: wrap;
}
.profile-info {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}
.profile-avatar {
  width: 64px;
  height: 64px;
  border-radius: var(--roundness-md);
  background: var(--gradient-cta);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 900;
  color: #fff;
  flex-shrink: 0;
}
.profile-eyebrow {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--on-surface-variant);
  margin-bottom: 4px;
}
.profile-name {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  line-height: 1;
}
.profile-name .first { color: var(--on-surface); }
.profile-name .last  { color: var(--surface-container-highest); }
.profile-tags {
  display: flex;
  gap: var(--space-xs);
  flex-wrap: wrap;
  margin-top: var(--space-sm);
}
.profile-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: var(--roundness-sm);
  background: var(--surface-container);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--on-surface-variant);
}
.profile-tag.active { color: #4ade80; background: rgba(74,222,128,0.1); }
.profile-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; }
.profile-actions {
  display: flex;
  gap: var(--space-sm);
}

/* === DASHBOARD GRID === */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-md);
}
.dashboard-col {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}
.dash-card {
  background: var(--surface-container-low);
  border-radius: var(--roundness-lg);
  padding: var(--space-lg);
}
.dash-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-lg);
}
.dash-card-title {
  font-family: var(--font-display);
  font-size: 0.875rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--on-surface);
}
.dash-card-subtitle {
  font-size: 0.7rem;
  color: var(--on-surface-variant);
  margin-top: 3px;
}
.chart-toggle {
  display: flex;
  gap: 2px;
}
.chart-toggle-btn {
  padding: 4px 10px;
  border-radius: var(--roundness-xs);
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: none;
  border: none;
  color: var(--on-surface-variant);
  transition: var(--transition-fast);
}
.chart-toggle-btn.active {
  background: var(--primary-container);
  color: #fff;
}

/* Gauge */
.gauge-items {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}
.gauge-item {}
.gauge-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.gauge-label {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--on-surface-variant);
}
.gauge-val {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--on-surface);
  line-height: 1;
}
.gauge-val .unit { font-size: 0.75rem; color: var(--on-surface-variant); }
.gauge-bar {
  height: 8px;
  background: var(--surface-container-highest);
  border-radius: 4px;
  overflow: hidden;
}
.gauge-fill {
  height: 100%;
  background: var(--gradient-cta);
  border-radius: 4px;
  transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Strength stat */
.strength-display {
  text-align: center;
  padding: var(--space-md) 0;
}
.strength-num {
  font-family: var(--font-display);
  font-size: 4rem;
  font-weight: 900;
  color: var(--on-surface);
  line-height: 1;
}
.strength-unit { font-size: 1rem; color: var(--on-surface-variant); }
.strength-label {
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--on-surface-variant);
  margin-top: 8px;
}
.strength-delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 700;
  color: #4ade80;
  margin-top: var(--space-sm);
}

/* Activity feed */
.activity-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}
.activity-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface-container);
  border-radius: var(--roundness-md);
  padding: 12px var(--space-md);
  transition: var(--transition-fast);
}
.activity-item:hover { background: var(--surface-container-high); }
.activity-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--roundness-sm);
  background: var(--surface-container-high);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.activity-icon svg { width: 16px; height: 16px; stroke: var(--on-surface-variant); fill: none; }
.activity-info { flex: 1; }
.activity-title {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--on-surface);
}
.activity-meta {
  font-size: 0.7rem;
  color: var(--on-surface-variant);
  margin-top: 2px;
}
.activity-status {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #4ade80;
}

/* Schedule */
.schedule-list {
  display: flex;

  --fc-border-color: var(--outline-variant);
  --fc-today-bg-color: rgba(192, 36, 37, 0.06);

  --fc-button-bg-color: var(--surface-container-high);

  for (let week = -1; week <= 3; week++) {
    const days = [1, 2, 3, 4, 5, 6]; // Mon-Sat

      const day = days[i % days.length];
      const d = new Date(year, month, now.getDate() + (week * 7) + (day - now.getDay()));

      const start = new Date(d);

        end:   end.toISOString(),
        className: `event-${t.type}`,
        extendedProps: { clientId: t.clientId, type: t.type }
      });
    });
  }
  return events;
}

<script>
const { CLIENTS, getClient, getInitials, statusLabel, generateCalendarEvents } = window.LHPT;

const overlay = document.getElementById('panelOverlay');
const events  = generateCalendarEvents();

function openPanel(info) {
  const evt = info.event;

  const c     = getClient(props.clientId);

  const start = evt.start;
  const end   = evt.end;

    elite:  { label: '1-on-1 Elite',      cls: 'session-type-elite'  },
    online: { label: 'Online Coaching',   cls: 'session-type-online' },
    group:  { label: 'Group Session',     cls: 'session-type-group'  },

  document.getElementById('panelBody').innerHTML = `
    <div class="session-info">
      <span class="session-type-badge ${t.cls}">${t.label}</span>
      <div class="session-title-panel">${evt.title}</div>
      <div class="session-time">${dateStr} • ${timeStr}${endStr ? ' – ' + endStr : ''}</div>

      </div>
    </div>

    <div>
      <div style="font-size:0.65rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--on-surface-variant);margin-bottom:var(--space-sm)">Performance Snapshot</div>
      <div class="panel-stats">
        <div class="panel-stat">
          <div class="num">${c.strengthIndex}</div>
          <div class="lbl">Strength</div>

/* === FULLCALENDAR INIT === */
let calendar;
document.addEventListener('DOMContentLoaded', () => {
  const el = document.getElementById('calendar');
  calendar = new FullCalendar.Calendar(el, {
    initialView: 'timeGridWeek',
    headerToolbar: {
      left:   'prev,next today',
      center: 'title',
      right:  'dayGridMonth,timeGridWeek,timeGridDay'
    },
    buttonText: { month: 'Month', week: 'Week', day: 'Day', today: 'Today' },
    slotMinTime: '05:00:00',
    slotMaxTime: '21:00:00',
    slotDuration: '00:30:00',
    allDaySlot: false,
    weekends: true,
    nowIndicator: true,
    height: 700,
    events: events,
    eventClick: openPanel,
    eventDidMount: (info) => {
      // Tooltip on hover
      info.el.title = info.event.title;
    },
    dayMaxEvents: 3,
    moreLinkClick: 'week',
    firstDay: 1, // Monday start
  });
  calendar.render();

  // Count stats
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay() + 1); weekStart.setHours(0,0,0,0);
  const weekEnd   = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6); weekEnd.setHours(23,59,59,999);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthEnd   = new Date(now.getFullYear(), now.getMonth() + 1, 0);

  let weekCount = 0, monthCount = 0, nextSession = null;
  events.forEach(e => {
    const s = new Date(e.start);
    if (s >= weekStart && s <= weekEnd) weekCount++;
    if (s >= monthStart && s <= monthEnd) monthCount++;
    if (s > now && (!nextSession || s < new Date(nextSession.start))) nextSession = e;
  });

  document.getElementById('statWeekSessions').textContent = weekCount;
  document.getElementById('statMonthSessions').textContent = monthCount;
  document.getElementById('statActiveClients').textContent = CLIENTS.filter(c => c.status === 'active').length;
  if (nextSession) {
    const d = new Date(nextSession.start);
    document.getElementById('statNextSession').textContent =
      d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  }
});

});

document.getElementById('confirmSession').addEventListener('click', () => {
  const clientId  = parseInt(document.getElementById('sess-client').value);
  const type      = document.getElementById('sess-type').value;
  const date      = document.getElementById('sess-date').value;
  const time      = document.getElementById('sess-time').value;
  const duration  = parseInt(document.getElementById('sess-duration').value);
  const titleInput = document.getElementById('sess-title').value;

  const c = getClient(clientId);
  if (!c || !date || !time) return;

  const start = new Date(`${date}T${time}:00`);
  const end   = new Date(start.getTime() + duration * 60000);
  const title = titleInput || `${c.firstName} ${c.lastName} — Session`;

  calendar.addEvent({
    title,
    start: start.toISOString(),
    end:   end.toISOString(),
    className: `event-${type}`,
    extendedProps: { clientId, type }
  });

  addModal.classList.remove('open');
  document.getElementById('sess-title').value = '';
});
</script>
