<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — Lee Hayward PT</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #161213; color: #EDE0E1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #1E1B1C; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; border: 1px solid rgba(154,143,144,0.12); }
    .logo { font-family: 'Lexend', sans-serif; font-size: 1rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
    .logo span { color: #FD772A; }
    .subtitle { font-size: 0.75rem; color: #9A8F90; margin-bottom: 32px; }
    h1 { font-family: 'Lexend', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
    p { font-size: 0.85rem; color: #9A8F90; line-height: 1.6; margin-bottom: 24px; }
    label { display: block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9A8F90; margin-bottom: 6px; }
    input { width: 100%; background: #252122; border: 1px solid rgba(154,143,144,0.2); border-radius: 8px; padding: 12px 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.9rem; color: #EDE0E1; outline: none; transition: border-color 0.15s; }
    input:focus { border-color: #FD772A; }
    .btn { width: 100%; padding: 13px; background: linear-gradient(45deg, #FD772A, #C04E00); color: #fff; border: none; border-radius: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; margin-top: 8px; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); border-radius: 8px; padding: 12px 14px; font-size: 0.85rem; color: #4ade80; margin-bottom: 16px; display: none; }
    .back { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #9A8F90; text-decoration: none; margin-top: 20px; transition: color 0.15s; }
    .back:hover { color: #EDE0E1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Lee Hayward <span>PT</span></div>
    <div class="subtitle">Client Portal</div>
    <h1>Forgot Password</h1>
    <p>Enter your email address and we'll send you a link to reset your password.</p>
    <div class="success" id="successMsg">Check your inbox — a reset link is on its way.</div>
    <form id="forgotForm">
      <div style="margin-bottom:16px">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="your@email.com" autocomplete="email" required/>
      </div>
      <button type="submit" class="btn" id="submitBtn">Send Reset Link</button>
    </form>
    <a href="/client-login.html" class="back">
      <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" width="14" height="14"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to login
    </a>
  </div>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Sending…'; btn.disabled = true;
      try {
        await fetch('/api/client/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        document.getElementById('forgotForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } catch {
        btn.textContent = 'Send Reset Link'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
